<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign in - Kolfe Employee Coupon</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 40px; margin: 0; }
        .card { max-width: 400px; background: #fff; padding: 30px; margin: 60px auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { margin-bottom: 20px; color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
        .setup-link { display: block; margin-top: 20px; text-align: center; text-decoration: none; color: #007bff; font-size: 13px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Sign in</h2>
    
    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div style="padding: 12px; margin-bottom: 15px; background: {% if category == 'danger' %}#f8d7da{% else %}#d4edda{% endif %}; color: {% if category == 'danger' %}#721c24{% else %}#155724{% endif %}; border-radius: 4px; font-size: 14px;">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group" style="margin-bottom: 20px;">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit">Sign in</button>
    </form>
    
    <a href="{{ url_for('setup') }}" class="setup-link">First setup: open /setup before creating users.</a>
</div>

</body>
</html>
