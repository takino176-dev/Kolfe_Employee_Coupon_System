<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kolfe Coupon System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: #ffffff; padding: 36px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
        .login-card h2 { text-align: center; color: #0f172a; font-weight: 800; margin-bottom: 24px; font-size: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 700; color: #475569; margin-bottom: 8px; font-size: 14px; }
        .form-control { width: 100%; padding: 12px 16px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.2s; }
        .form-control:focus { border-color: #2563eb; }
        .btn-primary { width: 100%; padding: 14px; background: #2563eb; color: #ffffff; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-primary:hover { background: #1d4ed8; }
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; font-weight: 600; text-align: center; }
        .alert-danger { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
        .alert-info { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        .alert-success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .alert-warning { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
        .help-text { text-align: center; font-size: 13px; color: #64748b; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Kolfe Coupon System</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label for="username">Employee ID / Username:</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="e.g. emp-0001" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password (Leave blank for first login):</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter password (if set)">
            </div>

            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <p class="help-text">First time logging in? Enter your Employee ID and click Sign In.</p>
    </div>
</body>
</html>
