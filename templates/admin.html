<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Merchant Portal - Scan Coupon</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f1f5f9; color: #334155; padding: 30px; display: flex; justify-content: center; }
        .card { background: #fff; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .form-group { margin: 20px 0; text-align: left; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #475569; }
        input { width: 100%; padding: 12px; border: 2px solid #2563eb; border-radius: 6px; font-size: 16px; text-align: center; font-weight: bold; }
        .btn { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .alert-success { padding: 12px; border-radius: 6px; background: #dcfce7; color: #166534; font-weight: 600; margin-bottom: 20px; }
        .alert-danger { padding: 12px; border-radius: 6px; background: #fee2e2; color: #991b1b; font-weight: 600; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🏪 Merchant Cashier Portal</h2>
        <p style="color:#64748b; font-size:13px; margin-top:5px;">Scan QR Code or paste token below</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>Scan / Enter QR Token:</label>
                <input type="text" name="qr_token" placeholder="Scan token here..." autofocus required>
            </div>
            <button type="submit" class="btn">Deduct Coupon (200 ETB)</button>
        </form>

        <a href="{{ url_for('logout') }}" style="display:inline-block; margin-top:20px; color:#dc2626; text-decoration:none; font-weight:600; font-size:13px;">Logout</a>
    </div>
</body>
</html>
