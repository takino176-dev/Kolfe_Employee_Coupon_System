{% extends 'base.html' %}
{% block title %}አስተዳዳሪ ዳሽቦርድ{% endblock %}
{% block content %}
<h2>የአስተዳዳሪ ዳሽቦርድ</h2>
<div style="display: flex; gap: 20px; margin-top: 20px;">
    <div class="card" style="flex: 1; text-align: center;">
        <h3>ጠቅላላ ሰራተኞች</h3>
        <p style="font-size: 32px; font-weight: bold; color: #2563eb;">{{ emp_count }}</p>
    </div>
    <div class="card" style="flex: 1; text-align: center;">
        <h3>የተሰጡ ክፍፍሎች</h3>
        <p style="font-size: 32px; font-weight: bold; color: #16a34a;">{{ alloc_count }}</p>
    </div>
    <div class="card" style="flex: 1; text-align: center;">
        <h3>አገልግሎት ሰጪዎች</h3>
        <p style="font-size: 32px; font-weight: bold; color: #d97706;">{{ merchant_count }}</p>
    </div>
</div>
{% endblock %}
