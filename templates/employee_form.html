<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Employee - Kolfe Coupon System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f1f5f9; color: #334155; padding: 30px; display: flex; justify-content: center; }
        .card { background: #fff; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #475569; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        .btn { width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-secondary { background: #64748b; margin-top: 10px; display: inline-block; text-align: center; text-decoration: none; width: 100%; padding: 10px; border-radius: 6px; color: white; font-weight: 600; }
        .alert { padding: 10px; border-radius: 6px; margin-bottom: 15px; background: #fee2e2; color: #991b1b; font-size: 12px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin-bottom: 20px;">+ Add New Employee</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>Employee ID (መታወቂያ)</label>
                <input type="text" name="employee_id" placeholder="e.g., EMP-101" required>
            </div>
            <div class="form-group">
                <label>Full Name (ስም)</label>
                <input type="text" name="full_name" placeholder="e.g., Abebe Bikila" required>
            </div>
            <div class="form-group">
                <label>Sector / Pool (ዘርፍ)</label>
                <input type="text" name="sector" placeholder="e.g., Design & Construction Pool" required>
            </div>
            <div class="form-group">
                <label>Monthly Allowance (ETB)</label>
                <input type="number" step="0.01" name="monthly_allowance" value="1000.00" required>
            </div>
            <button type="submit" class="btn">Save Employee</button>
            <a href="{{ url_for('employees') }}" class="btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
