<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee QR Cards - Kolfe Sub-City</title>
    <!-- Include qrcodejs library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f1f5f9; margin: 0; padding: 20px; color: #334155; }
        .no-print { text-align: center; margin-bottom: 20px; }
        .btn { background: #2563eb; color: white; padding: 10px 20px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #1d4ed8; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; border: 2px solid #cbd5e1; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); page-break-inside: avoid; }
        .org-title { font-size: 12px; font-weight: bold; color: #1e293b; margin-bottom: 10px; text-transform: uppercase; }
        .qr-container { margin: 15px auto; display: inline-block; padding: 10px; background: white; border: 1px solid #e2e8f0; border-radius: 8px; }
        .info { text-align: left; font-size: 14px; margin-top: 10px; background: #f8fafc; padding: 10px; border-radius: 6px; }
        .info p { margin: 5px 0; }
        @media print {
            body { background: white; }
            .no-print { display: none; }
            .card { border: 1px solid #94a3b8; box-shadow: none; }
        }
    </style>
</head>
<body>
    <div class="no-print">
        <button class="btn" onclick="window.print()">🖨️ Print All ID Cards</button>
        <a href="{{ url_for('employees') }}" class="btn" style="background:#64748b; margin-left:10px;">← Back to Employees</a>
    </div>

    <div class="grid">
        {% for emp in employees %}
        <div class="card">
            <div class="org-title">Kolfe Keraniyo Sub-City<br>დიዛይንና ግንባታ ፑል</div>
            <div class="qr-container" id="qrcode-{{ emp.id }}"></div>
            <div class="info">
                <p><strong>ስም (Name):</strong> {{ emp.full_name }}</p>
                <p><strong>መታወቂያ (ID):</strong> {{ emp.employee_id }}</p>
                <p><strong>ዘርፍ (Sector):</strong> {{ emp.sector }}</p>
                <p><strong>ግንባታ Balance:</strong> {{ emp.balance }} ETB</p>
            </div>
        </div>
        <script>
            new QRCode(document.getElementById("qrcode-{{ emp.id }}"), {
                text: "{{ emp.qr_token }}",
                width: 130,
                height: 130,
                colorDark: "#0f172a",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        </script>
        {% endfor %}
    </div>
</body>
</html>
