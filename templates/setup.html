<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Setup - Kolfe Coupon System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f1f5f9; color: #334155; padding: 30px; display: flex; justify-content: center; }
        .card { background: #fff; padding: 30px; border-radius: 12px; width: 100%; max-width: 550px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #475569; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        .btn { padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-secondary { background: #64748b; margin-left: 10px; text-decoration: none; display: inline-block; padding: 10px 20px; border-radius: 6px; color: white; font-weight: 600; }
        .alert { padding: 10px; border-radius: 6px; margin-bottom: 15px; background: #dcfce7; color: #166534; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin-bottom: 10px;">⚙️ System Setup & Configuration</h2>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 20px;">Manage administration defaults and coupon redemption limits.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>Organization Name</label>
                <input type="text" name="org_name" value="{{ config.org_name if config else 'Kolfe Keraniyo Sub-City Administration' }}" required>
            </div>
            <div class="form-group">
                <label>Department / Pool Title</label>
                <input type="text" name="department" value="{{ config.department if config else 'ዲዛይንና ግንባታ ፑል (Design & Construction Pool)' }}" required>
            </div>
            <div class="form-group">
                <label>Default Monthly Allowance (ETB)</label>
                <input type="number" step="0.01" name="default_allowance" value="{{ config.default_allowance if config else 1000.0 }}" required>
            </div>
            <div class="form-group">
                <label>Default Redemption Deduction Per Scan (ETB)</label>
                <input type="number" step="0.01" name="redemption_deduction" value="{{ config.redemption_deduction if config else 200.0 }}" required>
            </div>
            <div style="margin-top: 20px;">
                <button type="submit" class="btn">Save Configuration</button>
                <a href="{{ url_for('admin_dashboard') }}" class="btn-secondary">← Back to Dashboard</a>
            </div>
        </form>
    </div>
</body>
</html>
