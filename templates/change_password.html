{% extends "base.html" %}{% block content %}<div class="panel" style="max-width:500px;margin:auto"><h1>{{ 'ይለፍ ቃል ቀይር' if lang=='am' else 'Change password' }}</h1><p>Minimum 8 characters.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Current password</label><input type="password" name="old_password" required><label>New password</label><input type="password" name="new_password" minlength="8" required><label>Confirm password</label><input type="password" name="confirm_password" minlength="8" required><button>Save password</button></form></div>{% endblock %}
