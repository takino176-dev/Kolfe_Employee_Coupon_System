<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>የኩፖን ማተሚያ ገፅ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: #f1f5f9; padding: 15px; color: #000000; }

        /* የመቆጣጠሪያ ሳጥን (በማተሚያ ወቅት አይታይም) */
        .control-panel {
            background: #ffffff;
            padding: 18px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08);
            max-width: 950px;
            margin: 0 auto 20px auto;
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
        }

        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-group label { font-size: 13px; font-weight: bold; color: #475569; }
        .control-group input {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn-blue { background: #2563eb; }
        .btn-dark { background: #475569; }

        /* Each Employee gets their own strictly separated page container */
        .employee-page {
            width: 100%;
            margin-bottom: 30px;
            page-break-inside: avoid;
        }

        /* Force each new employee onto a brand new page when printing */
        @media print {
            .employee-page {
                page-break-before: always !important;
                break-before: page !important;
                margin-bottom: 0 !important;
            }
            .employee-page:first-child {
                page-break-before: auto !important;
                break-before: auto !important;
            }
        }

        /* ማተሚያ ሰንጠረዥ - በገጽ 22 ኩፖን (ላንድስኬፕ) */
        .print-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            width: 100%;
            margin: 0 auto;
        }

        /* የኩፖኑ ቅርፅ */
        .coupon-card {
            background: #ffffff;
            border: 1.5px solid #000000;
            border-radius: 3px;
            padding: 6px 8px;
            text-align: center;
            font-size: 9px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 150px;
            box-sizing: border-box;
            page-break-inside: avoid;
            line-height: 1.25;
        }

        .header-title { font-size: 9.5px; font-weight: bold; }
        .dept-title { font-size: 8.5px; font-weight: bold; }
        .coupon-title { font-size: 8.5px; font-weight: bold; margin-bottom: 2px; }

        .info-block {
            text-align: left;
            font-size: 8px;
            margin: 3px 0;
            line-height: 1.3;
        }

        .validity-note { font-size: 7.5px; font-weight: bold; margin: 2px 0; }
        .month-note { font-size: 7.5px; font-weight: bold; margin-bottom: 2px; }
        .price-tag { font-size: 9px; font-weight: bold; border-top: 1px solid #000; padding-top: 3px; margin-top: 2px; }

        /* የህትመት ቅንብር */
        @media print {
            @page {
                size: A4 landscape;
                margin: 5mm;
            }
            body { background: none; padding: 0; }
            .no-print { display: none !important; }
            .print-grid {
                grid-template-columns: repeat(6, 1fr);
                gap: 4px;
            }
            .coupon-card {
                box-shadow: none;
                border: 1.5px solid #000;
            }
        }
    </style>
</head>
<body>

    <!-- የመቆጣጠሪያ ክፍል -->
    <div class="control-panel no-print">
        <div class="control-group">
            <label for="monthInput">🗓️ ወር ያስገቡ:</label>
            <input type="text" id="monthInput" value="የጥቅምት ወር 2019 ዓ.ም" oninput="generateCards()" style="width: 220px;">
        </div>

        <div class="control-group">
            <label for="countInput">📄 የኩፖን ብዛት (ከ 1 እስከ 22):</label>
            <input type="number" id="countInput" value="22" min="1" max="22" oninput="generateCards()" style="width: 140px;">
        </div>

        <div>
            <button onclick="window.print()" class="btn btn-blue">🖨️ አትም (Print)</button>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-dark" style="margin-left: 8px;">ተመለስ</a>
        </div>
    </div>

    <!-- Container where all pages will render -->
    <div id="printContainer"></div>

    <script>
        // Data from backend
        const rawEmployees = [
            {% for emp in employees %}
            {
                id: "{{ emp.id }}",
                full_name: "{{ emp.full_name }}",
                sector: "{{ emp.sector }}"
            }{% if not loop.last %},{% endif %}
            {% endfor %}
        ];

        function generateCards() {
            const container = document.getElementById('printContainer');
            container.innerHTML = '';
            
            let couponCount = parseInt(document.getElementById('countInput').value) || 1;
            if (couponCount > 22) couponCount = 22;
            if (couponCount < 1) couponCount = 1;

            const selectedMonth = document.getElementById('monthInput').value || 'የጥቅምት ወር 2019 ዓ.ም';

            rawEmployees.forEach(emp => {
                // Wrapper page div per employee
                const pageDiv = document.createElement('div');
                pageDiv.className = 'employee-page';

                const gridDiv = document.createElement('div');
                gridDiv.className = 'print-grid';

                for (let i = 0; i < couponCount; i++) {
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'coupon-card';

                    cardDiv.innerHTML = `
                        <div>
                            <div class="header-title">በኮልፌ ቀራኒዮ ክፍለ ከተማ አስተዳደር</div>
                            <div class="dept-title">ዲዛይንና ግንባታ ፑል</div>
                            <div class="coupon-title">የሰራተኞች የህብ መስተንግዶ ኩፖን</div>
                        </div>

                        <div class="info-block">
                            <div><strong>የሰራተኛው ስም:</strong> ${emp.full_name}</div>
                            <div><strong>የሚሰሩበት ተቋም:</strong> ${emp.sector || 'የከተማ ውበትና አረንጓዴ ልማት ጽ/ቤት'}</div>
                        </div>

                        <div>
                            <div class="validity-note">ለአንድ ጊዜ አገልግሎት ብቻ የሚውል</div>
                            <div class="month-note">ለአገልግሎቱ በወጣው ${selectedMonth} ብቻ የሚያገለግል</div>
                            <div class="price-tag">የኩፖኑ ዋጋ 40 ብር</div>
                        </div>
                    `;

                    gridDiv.appendChild(cardDiv);
                }

                pageDiv.appendChild(gridDiv);
                container.appendChild(pageDiv);
            });
        }

        window.onload = function() {
            generateCards();
        };
    </script>
</body>
</html>
