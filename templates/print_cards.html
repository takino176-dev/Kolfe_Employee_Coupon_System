<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Print Employee QR Cards</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .no-print { text-align: center; margin-bottom: 20px; }
        .card-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .qr-card { background: white; border: 2px dashed #333; border-radius: 10px; width: 300px; padding: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); page-break-inside: avoid; }
        .qr-card h3 { margin: 5px 0; color: #1e293b; }
        .qr-card p { margin: 5px 0; color: #64748b; font-size: 14px; }
        .qr-card img { margin: 15px 0; width: 140px; height: 140px; }
        .btn { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; font-size: 16px; }
        @media print {
            .no-print { display: none; }
            body { background: white; padding: 0; }
            .qr-card { border: 1px solid #000; box-shadow: none; }
        }
    </style>
</head>
<body>
    <div class="no-print">
        <button class="btn" onclick="window.print()">🖨️ Print All Cards</button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn" style="background: #64748b; margin-left: 10px;">Back to Dashboard</a>
    </div>

    <div class="card-container">
        {% for emp in employees %}
        <div class="qr-card">
            <h3>{{ emp.full_name }}</h3>
            <p><strong>ID:</strong> {{ emp.employee_id }}</p>
            <p><strong>Sector:</strong> {{ emp.sector }}</p>
            <!-- Visual QR Code Generator -->
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data={{ emp.qr_token }}" alt="QR Code">
            <p style="font-size: 11px; word-break: break-all; color: #94a3b8;">Token: {{ emp.qr_token }}</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
