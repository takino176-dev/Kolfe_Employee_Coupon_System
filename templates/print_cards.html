<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የሰራተኞች ኩፖን መጠቀሚያ ኩፖን</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Ethiopic Fancy', 'Nyala', 'Kobera', 'Abyssinica SIL', 'Segoe UI', sans-serif; 
        }

        body { 
            background-color: #f1f5f9; 
            padding: 20px; 
        }

        /* ማጣሪያ እና ማተሚያ ቁልፍ (ከፕሪንት ውጭ) */
        .no-print {
            background: #ffffff;
            padding: 15px 20px;
            border-radius: 10px;
            max-width: 1000px;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }

        .no-print select {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn {
            padding: 9px 18px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        /* ገጽ (A4 Page for Single Employee) */
        .a4-page {
            width: 210mm;
            height: 297mm;
            padding: 8mm;
            margin: 0 auto 20mm auto;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            page-break-after: always;
            page-break-inside: avoid;
        }

        /* የኩፖኖች ድርድር (3 በአግድም X 8 በቁመት = 24 ኩፖን በገጽ) */
        .coupon-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4mm;
        }

        /* የነጠላ ኩፖን ሳጥን ዲዛይን */
        .coupon-box {
            border: 2px solid #334155;
            border-radius: 6px;
            padding: 6px;
            text-align: center;
            background: #fff;
            height: 33mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header-title {
            font-size: 11px;
            font-weight: bold;
            color: #0f172a;
            line-height: 1.2;
        }

        .sub-title {
            font-size: 10px;
            font-weight: bold;
            color: #1e293b;
            margin-top: 2px;
        }

        .emp-name {
            font-size: 11px;
            font-weight: bold;
            color: #0f172a;
            margin: 2px 0;
            border-bottom: 1px dashed #cbd5e1;
            padding-bottom: 2px;
        }

        .institution {
            font-size: 9.5px;
            color: #334155;
        }

        .notice {
            font-size: 9px;
            color: #475569;
            margin-top: 1px;
        }

        .footer-info {
            font-size: 9.5px;
            font-weight: bold;
            color: #0f172a;
            display: flex;
            justify-content: space-between;
            margin-top: 2px;
            border-top: 1px solid #e2e8f0;
            padding-top: 2px;
        }

        /* ለማተሚያ የሚሆን ስታይል (Print Rules) */
        @media print {
            @page {
                size: A4;
                margin: 5mm;
            }
            body { 
                background: #fff; 
                padding: 0; 
            }
            .no-print { 
                display: none !important; 
            }
            .a4-page {
                box-shadow: none;
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                page-break-after: always;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>

    <!-- ማጣሪያ እና ማተሚያ ቁልፍ -->
    <div class="no-print">
        <h3>🎟️ የኩፖን ማተሚያ ገጽ</h3>
        <div>
            <label for="sectorFilter">በዘርፍ/ተቋም አጣራ: </label>
            <select id="sectorFilter" onchange="filterCoupons()">
                <option value="ALL">ሁሉንም ዘርፎች</option>
                {% for sector in sectors %}
                <option value="{{ sector }}">{{ sector }}</option>
                {% endfor %}
            </select>
        </div>
        <button class="btn" onclick="window.print()">🖨️ ኩፖኖቹን አትም (Print)</button>
    </div>

    <!-- እያንዳንዱ ሰራተኛ የራሱ ገጽ (A4 Page Per Employee) አለው -->
    {% for emp in employees %}
    <div class="a4-page employee-page" data-sector="{{ emp.sector }}">
        <div class="coupon-grid">
            <!-- በአንድ ገጽ ላይ 24 ኩፖኖችን ድገም -->
            {% for i in range(24) %}
            <div class="coupon-box">
                <div>
                    <div class="header-title">ኮልፌ ቀራኒዮ ክፍለ ከተማ አስተዳደር<br>ዲዛይንና ግንባታ ፑል</div>
                    <div class="sub-title">የሰራተኞች ኩፖን መጠቀሚያ ኩፖን</div>
                </div>
                
                <div class="emp-name">{{ emp.full_name }}</div>
                
                <div class="institution">የሚሰራበት ተቋም: {{ emp.sector }}</div>
                
                <div class="notice">ለአንድ ጊዜ አገልግሎት የሚውል</div>
                
                <div class="footer-info">
                    <span>ለ {{ month or 'መስከረም' }} ወር {{ year or '2019' }} ዓ.ም ብቻ</span>
                    <span>የኩፖን ዋጋ 40 ብር</span>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endfor %}

    <script>
        function filterCoupons() {
            var selectedSector = document.getElementById('sectorFilter').value.toLowerCase();
            var pages = document.querySelectorAll('.employee-page');

            pages.forEach(function(page) {
                var sector = page.getAttribute('data-sector').toLowerCase();
                if (selectedSector === 'all' || sector === selectedSector) {
                    page.style.display = "block";
                } else {
                    page.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
