<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Merchant Dashboard - Kolfe Coupon System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f1f5f9; color: #334155; padding: 30px; }
        .card { background: #fff; padding: 24px; border-radius: 12px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #475569; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        .btn { padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #1d4ed8; }
        .alert { padding: 12px; border-radius: 6px; margin-bottom: 15px; background: #dcfce7; color: #15803d; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛒 Merchant Coupon Redemption</h2>
        <p style="font-size:13px; color:#64748b; margin-bottom:20px;">Scan or enter employee QR token to redeem monthly coupon allocation.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('merchant_dashboard') }}">
            <div class="form-group">
                <label>Employee QR Token / Code</label>
                <input type="text" name="qr_token" placeholder="Paste or scan token here..." required autofocus>
            </div>
            <button type="submit" class="btn">Verify & Redeem Coupon</button>
        </form>

        <div style="margin-top: 25px; border-top: 1px solid #e2e8f0; padding-top: 15px;">
            <a href="{{ url_for('logout') }}" style="color: #dc2626; text-decoration: none; font-weight: 600; font-size: 13px;">🚪 Logout</a>
        </div>
    </div>
</body>
</html>
