<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>የኤጀንት ገጽ - ኮልፌ ቀራኒዮ ኩፖን ሲስተም</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; }
        .dashboard { max-width: 900px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .stat-box { background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 20px; border-radius: 12px; font-size: 20px; font-weight: bold; }
        #reader { width: 100%; max-width: 450px; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; }
        th { background: #f1f5f9; }
        .btn { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="card stat-box">
            💰 አጠቃላይ የተሰበሰበ: {{ total_collected }} ETB
        </div>

        <div class="card" style="text-align: center;">
            <h3>📷 የሰራተኛ QR ኮድ በካሜራ ይቃኙ</h3>
            <div id="reader"></div>
            <div id="result" style="margin-top: 15px; font-weight: bold;"></div>
        </div>

        <div class="card">
            <h3>📋 በቅርቡ የተሰበሰቡ ክፍያዎች</h3>
            <table>
                <thead>
                    <tr>
                        <th>የሰራተኛ መታወቂያ</th>
                        <th>የተቀነሰ ብር</th>
                        <th>ዘርፍ</th>
                        <th>ቀንና ሰዓት</th>
                    </tr>
                </thead>
                <tbody>
                    {% for log in logs %}
                    <tr>
                        <td>{{ log.employee_id }}</td>
                        <td><strong>{{ log.amount_deducted }} ETB</strong></td>
                        <td>{{ log.sector }}</td>
                        <td>{{ log.timestamp.strftime('%Y-%m-%d %H:%M') }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            let amount = prompt("እባክዎን የሚቆረጠውን የብር መጠን ያስገቡ (ETB):", "40");
            if (amount && !isNaN(amount)) {
                fetch('/merchant/redeem', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ qr_token: decodedText, amount: amount })
                })
                .then(res => res.json())
                .then(data => {
                    if(data.success) {
                        alert("✅ " + data.message + "\nለሰራተኛው የቀረው ባላንስ: " + data.remaining_balance + " ETB");
                        location.reload();
                    } else {
                        alert("❌ " + data.message);
                    }
                });
            }
        }

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
