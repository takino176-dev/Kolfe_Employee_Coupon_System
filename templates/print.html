<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
    <style>
        @page { size: A4; margin: 10mm; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #fff; color: #000; font-size: 12px; }
        .badge-container { display: flex; flex-wrap: wrap; gap: 10mm; justify-content: center; }
        .id-badge { width: 85mm; height: 54mm; border: 1px solid #333; border-radius: 4px; padding: 6mm; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; background: #fff; page-break-inside: avoid; }
        .badge-header { font-weight: bold; text-align: center; font-size: 10px; border-bottom: 1px solid #ccc; padding-bottom: 4px; color: #12304a; }
        .badge-body { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 5px; }
        .badge-body img { width: 28mm; height: 28mm; }
        .badge-details { flex-grow: 1; line-height: 1.4; font-size: 11px; }
        .badge-footer { text-align: center; font-size: 8px; border-top: 1px solid #ccc; padding-top: 4px; font-weight: bold; color: #555; }
        .no-print { text-align: center; padding: 20px; background: #f3f6f9; margin-bottom: 20px; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>
    <div class="no-print">
        <h2>{{ title }}</h2>
        <button onclick="window.print()" style="padding: 10px 25px; background: #176b87; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;">Print ID Badges</button>
    </div>

    <div class="badge-container">
        {% for u in users %}
        <div class="id-badge">
            <div class="badge-header">{{ org }}<br>የሰራተኛ መታወቂያ / Employee ID Card</div>
            <div class="badge-body">
                <img src="{{ qr_data_uri(u) }}" alt="QR">
                <div class="badge-details">
                    <b>ስም:</b> {{ u.full_name }}<br>
                    <b>መለያ:</b> {{ u.employee_id }}<br>
                    <b>ዘርፍ:</b> {{ u.sector }}
                </div>
            </div>
            <div class="badge-footer">ለአገልግሎት ማረጋገጫ ብቻ የሚያገለግል</div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
