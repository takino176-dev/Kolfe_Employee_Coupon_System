<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Release Coupon Allocations</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css">
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-4 rounded shadow-sm" style="max-width: 600px;">
        <h2 class="mb-4">Release Monthly Coupon Allocation</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Month (YYYY-MM)</label>
                <input type="text" name="month" class="form-control" value="{{ month }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Allocation Amount per Employee (ETB)</label>
                <input type="number" step="0.01" name="amount" class="form-control" placeholder="e.g. 1000" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Release Allocation to All Employees</button>
        </form>
        <div class="mt-3 text-center">
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary btn-sm">Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
