<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Release Coupon Allocations</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css">
    <script>
        function toggleEmployeeSelect() {
            const target = document.getElementById('targetSelect').value;
            const singleDiv = document.getElementById('singleEmployeeDiv');
            if (target === 'single') {
                singleDiv.style.display = 'block';
            } else {
                singleDiv.style.display = 'none';
            }
        }
    </script>
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-4 rounded shadow-sm" style="max-width: 650px;">
        <h2 class="mb-4">Release Monthly Coupon Allocation</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Month (YYYY-MM)</label>
                <input type="text" name="month" class="form-control" value="{{ month }}" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">Allocation Type</label>
                <select name="target" id="targetSelect" class="form-select" onchange="toggleEmployeeSelect()">
                    <option value="all">Bulk - All Employees (1500+)</option>
                    <option value="single">Single Employee</option>
                </select>
            </div>

            <div class="mb-3" id="singleEmployeeDiv" style="display: none;">
                <label class="form-label fw-bold">Select Employee</label>
                <select name="employee_id" class="form-select">
                    {% for emp in employees %}
                    <option value="{{ emp.id }}">{{ emp.employee_id }} - {{ emp.full_name }} ({{ emp.sector }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Allocation Amount (ETB)</label>
                <input type="number" step="0.01" name="amount" class="form-control" placeholder="e.g. 1000" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Release Allocation</button>
        </form>
        
        <div class="mt-3 text-center">
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary btn-sm">Back to Dashboard</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
