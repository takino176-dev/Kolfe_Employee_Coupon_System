{% extends "base.html" %}
{% block content %}

<div class="panel" style="max-width: 450px; margin: 30px auto;">
    <h2>Create Merchant Account</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div style="padding: 10px; margin-bottom: 15px; background: {% if category == 'danger' %}#f8d7da{% else %}#d4edda{% endif %}; color: {% if category == 'danger' %}#721c24{% else %}#155724{% endif %}; border-radius: 4px;">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom: 5px; font-weight: bold;">Merchant Username</label>
            <input type="text" name="username" class="input" required style="width:100%; padding:8px; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 20px;">
            <label style="display:block; margin-bottom: 5px; font-weight: bold;">Password</label>
            <input type="password" name="password" class="input" required style="width:100%; padding:8px; box-sizing: border-box;">
        </div>
        <button type="submit" class="btn btn-success" style="width:100%;">Create Merchant</button>
    </form>

    <div style="text-align: center; margin-top: 15px;">
        <a href="{{ url_for('admin_dashboard') }}">Back to Admin Dashboard</a>
    </div>
</div>

{% endblock %}
