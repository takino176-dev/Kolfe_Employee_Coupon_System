{% extends "base.html" %}
{% block content %}

<div style="max-width: 600px; margin: 0 auto;">
    <div style="background: #fff; padding: 25px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px;">
        <h2>Merchant Scanner Portal</h2>
        <p style="color: #666; font-size: 14px;">Scan or type the Employee's QR Token to deduct coupons for services/meals.</p>

        <form action="{{ url_for('merchant_scan') }}" method="POST" style="margin-top: 20px;">
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">QR Code Token</label>
                <input type="text" name="qr_token" placeholder="Scan QR code here..." required autofocus style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px;">Coupon Amount to Deduct</label>
                <input type="number" step="0.01" name="amount" placeholder="e.g. 50.00" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px;">
            </div>
            <button type="submit" style="width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer;">Redeem Coupon</button>
        </form>
    </div>

    <!-- Merchant Collection Summary -->
    <div style="background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd;">
        <h3>Total Collected This Month ({{ month }}): <span style="color: #28a745;">{{ "%.2f"|format(total_collected) }}</span></h3>
    </div>
</div>

{% endblock %}
