{% extends 'base.html' %}
{% block title %}Excel ፋይል መጫኛ{% endblock %}
{% block content %}
<h2>ከ Excel የሰራተኞች መረጃ መጫኛ</h2>
<div class="card" style="max-width: 500px;">
    <form method="POST" enctype="multipart/form-data">
        <div style="margin-bottom: 15px;">
            <label>የ Excel ፋይል ይምረጡ (.xlsx):</label><br><br>
            <input type="file" name="file" accept=".xlsx, .xls" required>
        </div>
        <button type="submit" class="btn btn-success">መረጃውን ጫን</button>
    </form>
</div>
{% endblock %}
