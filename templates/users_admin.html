{% extends 'base.html' %}{% block body %}<h1>Merchant, Authority & Admin Accounts</h1><div class="card"><h3>Create account</h3><form method="post"><div class="grid"><div><label>Username</label><input name="username" required></div><div><label>Full name / business name</label><input name="full_name" required></div><div><label>Role</label><select name="role"><option value="merchant">Merchant</option><option value="authority">Authority</option><option value="admin">Admin</option></select></div><div><label>Sector / note (optional)</label><input name="sector"></div><div><label>Temporary password (8+ characters)</label><input type="password" name="password" minlength="8" required></div></div><p><button>Create account</button></p></form></div><div class="card"><h3>Existing operator accounts</h3><table><tr><th>Username</th><th>Name</th><th>Role</th><th>Active</th><th>Created</th></tr>{% for u in users %}<tr><td>{{u.username}}</td><td>{{u.full_name}}</td><td>{{u.role}}</td><td>{{u.active}}</td><td>{{u.created_at.strftime('%Y-%m-%d')}}</td></tr>{% endfor %}</table></div>{% endblock %}
